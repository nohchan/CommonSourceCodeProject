name: Build Windows EXE（全部）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 頭文字ごとに4台のWindowsサーバーで同時並列ビルド！
        pattern: ["[a-f]*.sln", "[g-m]*.sln", "[n-p]*.sln", "[q-z]*.sln"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows EXEs (${{ matrix.pattern }})
        shell: pwsh
        run: |
          $solutions = Get-ChildItem -Path "vc++2017" -Filter "${{ matrix.pattern }}"
          foreach ($sln in $solutions) {
            Write-Host "Building $($sln.Name)..."
            msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /m /nologo /verbosity:minimal
          }

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: windows-exes-${{ strategy.job-index }}
          path: |
            vc++2017/**/x64/Release/*.exe
            bin/**/*.exe
