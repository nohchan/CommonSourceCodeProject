name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. サブモジュールを含めてコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Java (JDK 17) のセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. X1turboZ の APK をビルド（プリインストール済みのSDK/NDKを使用）
      - name: Build X1turboZ APK
        working-directory: ./androidstudio
        run: |
          chmod +x gradlew
          ./gradlew assembleX1turbozDebug

      # 4. 完成したAPKをダウンロード可能にする
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: x1turboz-debug-apk
          path: androidstudio/app/build/outputs/apk/x1turboz/debug/*.apk
