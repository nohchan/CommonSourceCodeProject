name: Build Android APK（全部）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: "a-f", regex: "^[a-f]" }
          - { name: "g-m", regex: "^[g-m]" }
          - { name: "n-p8", regex: "^(n|p[a-z0-8])" }
          - { name: "p9-z", regex: "^(p9|[q-z])" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Android APKs (${{ matrix.group.name }})
        working-directory: ./androidstudio
        run: |
          chmod +x gradlew
          TARGETS=$(grep -E '^\s+[a-z0-9_]+\s*\{' app/build.gradle | sed -E 's/^\s+([a-z0-9_]+)\s*\{/\1/' | grep -vE '^(defaultConfig|buildFeatures|buildTypes|release|debug|ndk|externalNativeBuild|cmake|productFlavors|compileOptions|lintOptions|dependencies)$' | grep -E '${{ matrix.group.regex }}')
          for t in $TARGETS; do
            echo "=== Building $t ==="
            ./gradlew "assemble${t^}Release" --parallel --max-workers=4 || echo "Failed: $t (skipped)"
          done

      - name: Rename and Collect APKs
        run: |
          mkdir -p dist
          find androidstudio/app/build/outputs/apk -name "*-release.apk" | while read file; do
            base=$(basename "$file")
            newname="${base#app-}"
            newname="${newname%-release.apk}.apk"
            cp "$file" "dist/$newname"
          done
          ls -la dist/

      - name: Upload APKs (${{ matrix.group.name }})
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ matrix.group.name }}
          path: dist/*.apk
          if-no-files-found: warn
