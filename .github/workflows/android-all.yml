name: Build Android APK（全部）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build All Android APKs
        working-directory: ./androidstudio
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --continue

      - name: Rename and Collect APKs
        run: |
          mkdir -p dist
          find androidstudio/app/build/outputs/apk -name "*-release.apk" | while read file; do
            base=$(basename "$file")
            newname="${base#app-}"
            newname="${newname%-release.apk}.apk"
            cp "$file" "dist/$newname"
          done
          ls -la dist/

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-all-apks
          path: dist/*.apk
