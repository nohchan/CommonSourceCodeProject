name: Build Android APK（１つだけ）

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ビルドする機種名（例: x1turboz, pc8801ma, pc9801vx, msx2p）'
        required: true
        default: 'x1turboz'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Single Android APK
        working-directory: ./androidstudio
        run: |
          TARGET="${{ github.event.inputs.target }}"
          TASK="assemble${TARGET^}Release"
          echo "Running task: $TASK"
          chmod +x gradlew
          ./gradlew "$TASK"

      - name: Rename APK
        run: |
          mkdir -p dist
          find androidstudio/app/build/outputs/apk/${{ github.event.inputs.target }} -name "*-release.apk" | while read file; do
            cp "$file" "dist/${{ github.event.inputs.target }}.apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.target }}-apk
          path: dist/*.apk
